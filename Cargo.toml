[package]
name = "ippo"
version = "0.1.0"
edition = "2024"
description = "A fast, local-first habit tracker that lives in your terminal"
repository = "https://github.com/joolbyte/ippo"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
jiff = { version = "0.2", features = ["serde"] }
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
